name: build

on:
  workflow_call:
    inputs:
      release_mode:
        description: Run via release orchestrator
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

permissions:
  contents: read

jobs:
  image-hash:
    if: >-
      inputs.release_mode ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.event.pull_request.head.ref || '', 'release/v')
    runs-on: ubuntu-24.04
    outputs:
      hash: ${{ steps.hash.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: get CI image hash
        id: hash
        run: |
          set -uexo pipefail
          echo "value=${{ hashFiles('.github/Dockerfile') }}" >> "$GITHUB_OUTPUT"
  build:
    if: >-
      inputs.release_mode ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      !startsWith(github.event.pull_request.head.ref || '', 'release/v')
    needs: image-hash
    runs-on: ubuntu-24.04
    container: ghcr.io/samcday/phrog-ci:${{ needs.image-hash.outputs.hash }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build
        run: |
          set -uexo pipefail
          cargo build --all-targets --verbose
      - name: Lint
        run: |
          cargo clippy --all-targets --verbose
      - name: Lint (fmt)
        run: |
          cargo fmt --all --check
      - name: Test
        run: |
          set -uexo pipefail

          export XDG_RUNTIME_DIR=/tmp

          # run tests
          export RECORD_TESTS="$PWD/demo-video/recordings/"
          export G_MESSAGES_DEBUG=all
          cat > phoc.ini <<HERE
          [output:X11-1]
          mode = 720x1440
          scale = 2
          HERE
          dbus-run-session xvfb-run -a -s -noreset phoc -C phoc.ini -S -E "cargo test --verbose -- --test-threads=1 --nocapture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-recordings
          path: demo-video/recordings/*.mp4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  demo:
    if: inputs.release_mode
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: test-recordings
          path: demo-video/recordings
      - name: Generate demo.mp4 with editly
        run: |
          set -uexo pipefail
          docker run \
            --rm \
            -v "$PWD/demo-video:/work" \
            -i ghcr.io/samcday/editly@sha256:65795ffd7ef9d3aa6a58c590a71e5fa0a9bea17641fcd24921ae4b9a2d40c3d7 \
            bash -c 'cd /work; editly --json editly.json5; \
            ffmpeg -i demo.mp4 -vcodec libwebp -filter:v fps=fps=60 -lossless 0 -loop 0 -preset default -an -vsync 0 -s 160:320 demo.webp \
            '
      - uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: |
            demo-video/demo.mp4
            demo-video/demo.webp
